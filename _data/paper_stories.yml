paoa:
  summary: A variational Monte Carlo framework that learns stochastic dynamics and connects them to probabilistic hardware.
  introduction: Can the dynamics of a probabilistic computer become the object of learning? Generalized PAOA parameterizes
    the couplings, fields, and schedules of a stochastic system, then improves them using sampled costs. The figures follow
    that idea from its mathematical construction to benchmarks and a learned annealing principle.
  figures:
  - title: Start with a learnable Markov flow.
    text: A classical optimizer updates the parameters that drive a probabilistic computer. Exact probability flow provides
      the theoretical description; independent samples provide a practical estimate when the state space becomes too large
      to enumerate.
    notes:
    - label: "The feedback loop"
      text: "The classical optimizer updates couplings and biases; the probabilistic computer returns configurations from the resulting dynamics. The cost is evaluated from those samples, so the learned object is a search procedure rather than a single candidate solution."
    image: /images/paper-stories/paoa/figure-1.webp
    page: 2
  - title: Check the theory on a majority gate.
    text: A four-node majority gate makes the target distribution small enough to inspect directly. Analytical and sample-based
      optimization reach matching outcomes, connecting the variational formulation to the sampling procedure used in larger
      systems.
    notes:
    - label: "Panels (a) and (b)"
      text: "The four-node majority gate provides a small problem with eight valid input–output combinations. The loss curves compare exact-gradient training with sample-based, gradient-free optimization, so both methods can be checked against the same known target."
    - label: "Panels (c) and (d)"
      text: "Follow the probability assigned to each state over two layers. The exact Markov calculation is shown in (c); the MCMC approximation is shown in (d). Both concentrate probability on truth-table states rather than treating every configuration as equally likely."
    image: /images/paper-stories/paoa/figure-2.webp
    page: 5
  - title: Recover annealing on an FPGA.
    text: The next step moves from a small truth table to a three-dimensional spin glass. Optimizing the schedule on an FPGA-based
      probabilistic computer shifts the energy distribution toward lower-energy solutions and recovers an annealing-like trajectory.
    notes:
    - label: "Panels (a) and (b)"
      text: "The FPGA supplies configurations while a CPU updates the annealing schedule. The energy histogram compares the same spin-glass instance before and after optimization; the useful change is a larger concentration of samples near the putative ground state."
    - label: "Panel (c)"
      text: "Schedules at depths 5, 10, and 15 start from the same flat inverse-temperature profile. The learned profiles resemble cooling schedules. The insets compare success probabilities across repeated optimization runs, exposing variation that a single best schedule would hide."
    image: /images/paper-stories/paoa/figure-3.webp
    page: 6
  - title: Compare matched parameter budgets.
    text: PAOA and QAOA are compared on the 26-spin Sherrington–Kirkpatrick model using matched parameter counts. The energy
      and approximation-ratio plots show how each method changes as the number of layers increases.
    notes:
    - label: "Panels (a) and (b)"
      text: "Panel (a) compares energy at matched parameter counts on 26-spin test instances. Panel (b) summarizes approximation ratios and bootstrap confidence intervals; PAOA schedules are transferred from a separate training set without retraining."
    image: /images/paper-stories/paoa/figure-4.webp
    page: 7
  - title: Let different spins follow different schedules.
    text: Heavy-tailed couplings create distinct groups of strongly and weakly connected spins. A two-schedule ansatz learns
      different temperature profiles for these groups, suggesting a problem-dependent annealing strategy that can be extended
      to larger depths.
    notes:
    - label: "Panels (a) and (b)"
      text: "Sorting the heavy-tailed couplings separates strongly and weakly connected spins. The two groups receive different learned schedules, making the comparison about the structure of the problem rather than simply increasing annealing depth."
    - label: "Panels (c)–(e)"
      text: "The learned distinction motivates longer double schedules. The final panels compare average and instance-by-instance success against single-schedule simulated annealing, showing both aggregate performance and variation across the tested problems."
    image: /images/paper-stories/paoa/figure-5.webp
    page: 8
  conclusion_title: Learning a procedure for search.
  conclusion: The progression connects a variational description, a controlled benchmark, hardware execution, and a learned
    scheduling rule. PAOA provides a framework for adapting the stochastic search process to the structure of the problem.
  related:
  - paoaSPAD
  - isingformer
  - ising-machines-generative-ai
paoaSPAD:
  summary: PAOA on a 64 × 64 single-photon avalanche diode array, with learning adapted to real device responses.
  introduction: A hardware sampler rarely behaves like an ideal mathematical activation function. This work asks whether variational
    optimization can operate with the asymmetric responses and variability of real SPAD devices. The story moves from the
    physical platform to characterization, algorithm tests, and deeper simulated schedules.
  figures:
  - title: Close the loop around a real array.
    text: The hardware–software loop combines a classical optimizer, cost evaluations, and samples from a 64 × 64 perimeter-gated
      SPAD array. The chip and board photographs place the algorithm alongside the physical platform and its nonuniform device
      responses.
    notes:
    - label: "Panel (a)"
      text: "The optimizer receives a cost estimated from sampled configurations and updates the PAOA parameters. This is the algorithmic loop that the physical sampler supports."
    - label: "Panels (b) and (c)"
      text: "The die view shows distinct device activation curves, while the board photograph places the array alongside its control and readout circuitry. Their separation makes device variability visible within the system architecture."
    image: /images/paper-stories/paoaSPAD/figure-1.webp
    page: 2
  - title: Turn avalanche events into probabilistic bits.
    text: Gate voltage changes the dark-count behavior of each device. Quenching, reset, and a defined integration window
      turn those stochastic events into binary outputs; their averaged response reveals the activation function available
      to the algorithm.
    notes:
    - label: "Panels (a) and (b)"
      text: "The perimeter gate changes the electric field near the SPAD junction edge. The readout circuit then converts avalanche events into a bit: at least one event within the integration window gives one output state, while no event gives the other."
    - label: "Panels (c) and (d)"
      text: "The time traces show how gate voltage changes switching statistics. The measured activation curves compare devices, rather than repeated measurements of one ideal element; the Gompertz fit describes their asymmetric average response."
    image: /images/paper-stories/paoaSPAD/figure-2.webp
    page: 3
  - title: Match the algorithm to the device response.
    text: The benchmarks separate activation mismatch from matched hardware deployment. They compare idealized tanh and asymmetric
      Gompertz responses, then place measured SPAD inference alongside simulation using a hardware-matched training model.
    notes:
    - label: "Panels (a) and (b)"
      text: "Residual energy and approximation ratio compare matched tanh training/inference with tanh training followed by Gompertz inference. The schedules are learned on training instances and applied to a separate test set without retraining."
    - label: "Panels (c) and (d)"
      text: "These panels instead use matched Gompertz schedules for both hardware and CPU inference. The hardware averages 50 runs, compared with one million in simulation. Bootstrap confidence intervals help distinguish agreement from sampling variability."
    image: /images/paper-stories/paoaSPAD/figure-3.webp
    page: 4
  - title: Ask what happens at greater depth.
    text: CPU simulations extrapolate schedules learned at shallow depth to much longer runs. Residual energy and approximation
      ratio track the resulting improvement. These large-depth curves are simulations, rather than additional measurements
      on the physical array.
    notes:
    - label: "Panels (a) and (b)"
      text: "The same extrapolated schedules are evaluated using residual energy and approximation ratio. They were learned at depth 17 and extended without retraining; these large-depth results are CPU simulations, with confidence intervals across the tested instances and runs."
    image: /images/paper-stories/paoaSPAD/figure-4.webp
    page: 5
  conclusion_title: Learning with device characteristics.
  conclusion: The experiments connect device characterization to the optimization procedure. They support using a model of
    the hardware response during learning instead of assuming that every physical stochastic element implements an ideal tanh
    function.
  related:
  - paoa
  - configurable-p-neurons
  supplementary:
  - title: Compare the physical SPAD structures.
    text: Cross-sections contrast a conventional SPAD with its perimeter-gated variant. The gate provides a way to influence
      the junction-edge electric field and the resulting stochastic behavior.
    notes:
    - label: "Panels (a) and (b)"
      text: "The cross-sections compare a conventional SPAD with the added perimeter gate. That gate provides a separate way to influence the junction-edge field."
    image: /images/paper-stories/paoaSPAD/figure-S1.webp
    page: 8
  - title: Connect dark counts to operating conditions.
    text: The panels relate carrier-generation mechanisms to bias voltage, temperature, and gate voltage. These measurements
      explain why a device’s probabilistic response changes with its environment.
    notes:
    - label: "Panel (a) and panels (b)–(d)"
      text: "Carrier-generation mechanisms are followed by measured dark-count rates versus excess bias, temperature, and gate voltage. Minimum, maximum, and mean curves expose variation across the array."
    image: /images/paper-stories/paoaSPAD/figure-S2.webp
    page: 9
  - title: Inspect the chip and pixel architecture.
    text: The photomicrograph and circuit schematic connect the 64 × 64 array to the addressing, quenching, reset, and readout
      functions required for characterization.
    notes:
    - label: "Panels (a) and (b)"
      text: "The micrograph identifies the array on the die. The circuit diagram shows the addressing, quench/reset, and counter blocks that make individual-pixel characterization possible."
    image: /images/paper-stories/paoaSPAD/figure-S3.webp
    page: 9
  - title: Describe the asymmetric activation mathematically.
    text: The Gompertz response and its derivatives identify the midpoint, inflection point, and transition range. They provide
      interpretable quantities for modeling the measured activation curves.
    notes:
    - label: "Panels (a)–(c)"
      text: "The activation curve and its first two derivatives distinguish the midpoint, inflection point, and transition range of the asymmetric Gompertz response."
    image: /images/paper-stories/paoaSPAD/figure-S4.webp
    page: 10
  - title: Separate fabrication variation from operating shifts.
    text: Simulations and measurements show how slope and midpoint change across device parameters, integration windows, and
      temperature. These effects motivate activation-aware learning.
    notes:
    - label: "Panels (a)–(c)"
      text: "Simulation separates slope changes from midpoint shifts. Measurements then show how integration time and temperature alter the effective activation curve, alongside manufacturing variability."
    image: /images/paper-stories/paoaSPAD/figure-S5.webp
    page: 11
  - title: Document the characterization apparatus.
    text: The temperature chamber, data-acquisition equipment, board, and die connect the reported device responses to the
      actual measurement setup.
    notes:
    - label: "Panels (a) and (b)"
      text: "The temperature chamber, liquid-nitrogen tank, and power supplies establish the operating conditions. The data-acquisition setup supplies timing signals and records the device output, connecting the characterization curves to a physical measurement procedure."
    - label: "Panels (c) and (d)"
      text: "The board photograph shows the wire-bonded chip and protected connections. The micrograph locates the 64 × 64 array and its peripheral logic. These are different views of the same measurement platform, from laboratory equipment down to the die."
    image: /images/paper-stories/paoaSPAD/figure-S6.webp
    page: 12
  - title: Return to a small, inspectable learning problem.
    text: A majority-gate benchmark compares matched tanh and Gompertz learning with mismatched inference. The loss, divergence,
      and final state distributions make the effect of activation choice visible.
    notes:
    - label: "Panels (a) and (b)"
      text: "The majority-gate network and its valid truth-table states define an exactly inspectable target. The training curves then compare learning with symmetric tanh and asymmetric Gompertz activations."
    - label: "Panels (c) and (d)"
      text: "KL divergence and the final state probabilities distinguish matched training/inference from activation mismatch. Comparing these two panels checks both a scalar error measure and which configurations receive probability at the final depth."
    image: /images/paper-stories/paoaSPAD/figure-S7.webp
    page: 13
isingformer:
  summary: Transformer-generated configurations augment parallel tempering with whole-system proposal moves.
  introduction: Local Monte Carlo moves can struggle to traverse a rugged energy landscape. IsingFormer learns configurations
    at different temperatures and supplies global proposals to a parallel-tempering search. The paper first tests what the
    model learns, then studies spin glasses, reusable factorization encodings, and conditional scaling results.
  figures:
  - title: Combine a learned generator with a search process.
    text: A temperature-conditioned Transformer learns from long-run MCMC configurations. It proposes complete configurations
      to selected replicas of a parallel-tempering ladder, where local updates and replica exchanges continue to propagate
      promising states.
    notes:
    - label: "Left: learning configurations"
      text: "Long-run MCMC provides configurations at several inverse temperatures. A decoder-only Transformer learns a temperature-conditioned distribution over complete spin states, using both position information and a learned temperature embedding."
    - label: "Right: using proposals"
      text: "Generated configurations enter hot and intermediate replicas of a parallel-tempering ladder. Energy evaluation filters proposals, while local updates and replica swaps continue the search. The coldest replicas are not directly supplied with generated proposals."
    image: /images/paper-stories/isingformer/figure-1.webp
    page: 2
  - title: Test temperature interpolation and context.
    text: The two-dimensional Ising model offers physical quantities against which to check generated samples. Free energy,
      magnetization, and clamped-boundary examples test both interpolation to unseen temperatures and conditional generation
      outside the training setup.
    notes:
    - label: "Panels (a) and (b)"
      text: "Free energy tests interpolation between trained temperatures, while magnetization checks the finite-size transition. The comparison uses an exact free-energy reference and Gibbs samples, rather than relying on visual similarity alone."
    - label: "Panel (c)"
      text: "The half-clamped boundary is absent from training. Energy variance after a single Gibbs sweep tests whether Transformer initialization helps under that changed condition."
    image: /images/paper-stories/isingformer/figure-2.webp
    page: 4
  - title: Introduce global moves into a spin-glass search.
    text: For three-dimensional spin-glass instances, the plots track residual energy against Monte Carlo sweeps. Turning
      on proposal moves changes the search trajectory relative to ordinary parallel tempering, with learned and MCMC-generated
      proposals compared separately.
    notes:
    - label: "Panels (a) and (b)"
      text: "The proposal source changes from IsingFormer to long-run MCMC. The dashed line marks activation after 100 sweeps, allowing the subsequent energy reduction to be compared with ordinary parallel tempering under each proposal source."
    image: /images/paper-stories/isingformer/figure-3.webp
    page: 6
  - title: Reuse one generator across factorization targets.
    text: An invertible multiplier circuit encodes candidate factors and their product. Training with unclamped product spins
      creates a reusable generator; clamping a particular product later defines the search task for that target.
    notes:
    - label: "Panels (a) and (b)"
      text: "Clamping the product of an invertible multiplier turns factorization into an Ising search problem. Training uses an unclamped universal circuit; at inference, a target product conditions the search while the trained generator is reused."
    - label: "Panels (c) and (d)"
      text: "The timing comparison covers 440 semiprime instances at a target success probability of 0.99. The example trajectory follows the relative product error for 1,022,117 = 1009 × 1013. The timing is conditional on an already-generated proposal bank."
    image: /images/paper-stories/isingformer/figure-4.webp
    page: 7
  - title: Separate search timing from proposal generation.
    text: The scaling experiment measures time to solution conditional on pre-generated proposal banks. The fitted exponents
      compare the tested search procedures; generating those proposal banks is excluded, so this is not a claim of an end-to-end
      speedup including model training and generation.
    notes:
    - label: "Reading the axes"
      text: "The horizontal axis is the maximum product bit length; the vertical axis is the median time to reach a 0.99 success probability. Markers summarize instances, error bars give bootstrap confidence intervals, and dashed lines show exponential fits."
    - label: "What is timed"
      text: "This experiment uses proposals generated by long-run MCMC, rather than IsingFormer. Optimization operations are included, but offline proposal-bank generation is excluded. The fitted exponents, 0.846 for PT and 0.564 for TAPT, describe this conditional comparison."
    image: /images/paper-stories/isingformer/figure-5.webp
    page: 8
  conclusion_title: Learned moves, carefully interpreted.
  conclusion: The generator and Monte Carlo search play complementary roles. The energy-only proposal rule is used here as
    an optimization heuristic; the supplementary analysis explains why unbiased equilibrium sampling requires a fuller correction.
  related:
  - paoa
  - ising-machines-generative-ai
  supplementary:
  - title: Use learned initialization under unfamiliar boundaries.
    text: Spin configurations compare Transformer and random initialization when part of the lattice is clamped. The test
      probes whether learned context helps the subsequent Monte Carlo evolution.
    notes:
    - label: "Panels (a)–(c)"
      text: "The long-run reference is compared with one sweep after Transformer initialization and one sweep from random initialization. Similar-looking configurations suggest a useful starting state, but do not by themselves establish convergence."
    image: /images/paper-stories/isingformer/figure-S1.webp
    page: 15
  - title: Check the acceptance rule in a controlled circuit.
    text: A small full-adder system makes the stationary distribution directly inspectable. The example shows why energy-only
      acceptance of external proposals does not generally preserve the Boltzmann target.
    notes:
    - label: "Panels (a) and (b)"
      text: "A five-spin full-adder and a controlled three-replica ladder make the target distribution exactly inspectable. Proposals are supplied to two replicas, leaving the coldest replica unaugmented."
    - label: "Panel (c)"
      text: "The nonzero limiting KL divergence under the energy-only acceptance rule exposes its sampling bias. Exact transition-matrix results and Monte Carlo estimates distinguish optimization usefulness from unbiased equilibrium sampling."
    image: /images/paper-stories/isingformer/figure-S2.webp
    page: 17
  - title: Turn proposal moves off.
    text: The warm-start experiment enables proposals only for the first part of the run. The later trajectories test whether
      an early advantage persists when the search returns to ordinary parallel tempering.
    notes:
    - label: "Panels (a) and (b)"
      text: "Both proposal sources are switched off after the initial 100 sweeps. The later approach toward the PT baseline tests whether the early advantage survives without continued proposal moves."
    image: /images/paper-stories/isingformer/figure-S3.webp
    page: 18
  - title: Vary proposal coverage and context.
    text: Ablations change which replicas receive proposals and how their context is chosen. These experiments isolate design
      choices in the proposal mechanism using MCMC-generated configurations.
    notes:
    - label: "Panels (a) and (b)"
      text: "The first ablation changes which replicas receive proposals; the second changes how much of the current state conditions a proposal. Both use MCMC-generated candidates, isolating these choices from Transformer training."
    image: /images/paper-stories/isingformer/figure-S4.webp
    page: 19
  - title: Measure proposal acceptance across temperatures.
    text: Acceptance varies across the parallel-tempering ladder. The per-replica plot shows where global candidates are accepted
      and where the existing configurations are harder to replace.
    notes:
    - label: "Reading the replica index"
      text: "Indices run from hotter to colder replicas. The plot covers proposal-enabled replicas 1–20; replicas 21 and 22 receive no proposals, so there is no acceptance-rate measurement for them here."
    image: /images/paper-stories/isingformer/figure-S5.webp
    page: 20
  - title: Inspect communication between neighboring replicas.
    text: Swap-acceptance probabilities compare ordinary and augmented parallel tempering. This checks how the added proposal
      moves affect the exchange pathway through the temperature ladder.
    notes:
    - label: "What is compared"
      text: "The curves measure exchanges between adjacent replicas, combining the alternating swap stages. Their broad similarity checks whether adding proposals substantially changes this communication pathway in the tested ladder."
    image: /images/paper-stories/isingformer/figure-S6.webp
    page: 20
  - title: Use a small logic gate as a distribution check.
    text: The three-spin AND-gate model provides an exactly enumerable example. Its truth table and Boltzmann probabilities
      connect the circuit encoding to the intended target distribution.
    notes:
    - label: "Panels (a)–(c)"
      text: "The Ising graph, truth table, and eight-state distribution connect the encoding to the logical constraint. States 0, 2, 4, and 7 satisfy the AND relation and receive the largest probabilities."
    image: /images/paper-stories/isingformer/figure-S7.webp
    page: 21
ising-machines-generative-ai:
  summary: A review connecting probabilistic algorithms, hardware constraints, optimization, and generative models.
  introduction: Which algorithms can move between Ising platforms, and where does the hardware change the algorithm itself?
    This review uses a co-design perspective to connect problem encoding, sampling methods, capacity limits, variational optimization,
    and generative AI. Its four figures form a map of those connections.
  figures:
  - title: Begin with the algorithm–hardware loop.
    text: A task is encoded as an Ising energy landscape, an algorithm drives exploration, and samples are evaluated against
      the original objective. Hardware capabilities constrain this loop while new algorithms create demands for different
      hardware features.
    notes:
    - label: "Panel (a)"
      text: "The task is encoded as an energy function before the machine explores configurations. Hardware constraints and algorithmic requirements feed back into one another, so the workflow includes both problem formulation and physical execution."
    - label: "Panel (b)"
      text: "The three algorithm families place different demands on hardware: annealing needs temperature scheduling, tempering needs replica exchange and energy calculations, and variational methods need sampled feedback to a classical optimizer."
    image: /images/paper-stories/ising-machines-generative-ai/figure-1.webp
    page: 2
  - title: Work beyond the capacity of one chip.
    text: Cluster mean-field methods partition a large interaction graph into hardware-sized pieces. The figure contrasts
      serial and parallel updates, showing how classical processing approximates interactions at the boundaries between clusters.
    notes:
    - label: "Panels (a)–(c)"
      text: "The interaction graph is partitioned into hardware-sized clusters. An active cluster is updated while the remaining clusters are frozen, and a classical processor approximates interactions across their boundaries."
    - label: "Panels (d) and (e)"
      text: "CPU curves compare convergence as the cluster count changes. The FPGA comparison then tests a larger problem than one device can hold, separating a capacity-scaling method from a claim about arbitrary partitioning being equally effective."
    image: /images/paper-stories/ising-machines-generative-ai/figure-2.webp
    page: 8
  - title: Make the stochastic trajectory variational.
    text: PAOA adds a learnable layer to the workflow. Costs estimated from samples update effective couplings, fields, or
      schedules, creating a sequence of stochastic dynamics adapted to the optimization problem.
    notes:
    - label: "The two sides of the loop"
      text: "The CPU evaluates the sampled objective and changes variational parameters. The Ising machine returns states under those parameters; repeating the exchange learns a non-equilibrium trajectory rather than assuming a fixed thermal distribution."
    image: /images/paper-stories/ising-machines-generative-ai/figure-3.webp
    page: 9
  - title: Connect generative models and Ising machines.
    text: 'The relationship works in both directions: samples from probabilistic systems can train generative models, while
      learned models can propose global configurations for search. The generator–verifier view helps distinguish proposing
      a candidate from evaluating its quality.'
    notes:
    - label: "Training and search"
      text: "The left side supplies temperature-indexed MCMC data for the generator. The right side inserts complete generated configurations into a tempering search, where proposal evaluation and replica exchange remain necessary. The acceptance rule determines whether the resulting process is suitable for equilibrium sampling or optimization."
    image: /images/paper-stories/ising-machines-generative-ai/figure-4.webp
    page: 12
  conclusion_title: A common language across platforms.
  conclusion: The figures move from the basic workflow to capacity scaling, learned dynamics, and generative proposals. Together
    they explain why probabilistic computing benefits from developing algorithms and physical implementations in conversation
    with one another.
  related:
  - paoa
  - paoaSPAD
  - isingformer
configurable-p-neurons:
  summary: Modular p-bits support configurable probabilistic activation functions and shared stochastic resources.
  introduction: Can a stochastic neuron be designed as reusable parts rather than a tightly coupled circuit? This work separates
    the source of randomness from the input and activation paths. The figures develop the architecture, demonstrate configurable
    responses, and test how sharing stochastic units affects a digital implementation.
  figures:
  - title: Separate randomness from the input path.
    text: The opening architecture contrasts a coupled p-bit with a modular design. Decoupling the stochastic and activation
      units makes it possible to change the neuron response without rebuilding the entire source of randomness.
    notes:
    - label: "Panel (a)"
      text: "In the original architecture, the stochastic element and input path meet within the same circuit. Changing the random source or its response can therefore also affect how the input is processed."
    - label: "Panel (b)"
      text: "The modular architecture separates the stochastic unit from the input and activation paths. The dual-sMTJ example supplies randomness to a distinct activation circuit, giving the designer separate choices for these two functions."
    - label: "Panel (c)"
      text: "The lower diagrams connect a random-variable distribution and an instantaneous activation function to the time-averaged neuron response. The point is configurability: different combinations can produce probabilistic tanh, sigmoid, ReLU, or linear behavior."
    image: /images/paper-stories/configurable-p-neurons/figure-1.webp
    page: 1
  - title: Build several activation functions.
    text: Spintronic circuit examples implement probabilistic versions of tanh, sigmoid, and ReLU. Instantaneous outputs and
      time-averaged responses connect transistor-level designs to the activation functions they realize.
    notes:
    - label: "Panels (a)–(c)"
      text: "Instantaneous responses and time averages are shown separately for probabilistic tanh, sigmoid, and ReLU neurons. The average activation is the quantity to compare with the intended nonlinear function."
    - label: "Panels (d)–(f)"
      text: "The corresponding transistor-level designs change the activation circuit and stochastic unit. Comparing each circuit with the response directly above it connects the modular design choices to the measured behavior."
    image: /images/paper-stories/configurable-p-neurons/figure-2.webp
    page: 2
  - title: Engineer the distribution of the stochastic unit.
    text: Different stochastic-unit constructions produce different voltage distributions. The normal-like and uniform-like
      examples show how this module can be selected to support the desired probabilistic activation.
    notes:
    - label: "Panel (a)"
      text: "Two stochastic magnetic tunnel junctions form a voltage divider. The conductance histograms on the left describe the individual elements; the voltage histogram on the right shows the approximately normal distribution produced by the combined stochastic unit."
    - label: "Panel (b)"
      text: "Replacing one junction with a fixed resistor changes the output distribution to approximately uniform. Comparing the two rows shows why the stochastic unit is a design choice: its distribution helps determine the neuron’s eventual activation function."
    image: /images/paper-stories/configurable-p-neurons/figure-3.webp
    page: 2
  - title: Tune the range of probabilistic behavior.
    text: The response is not fixed by the architecture alone. Supply conditions and device characteristics change the transition
      range, providing circuit-level controls over the resulting activation function.
    notes:
    - label: "Panels (a)–(c)"
      text: "Supply voltage tunes the stochastic distribution, β scales the tanh response, and the final plot relates the available probabilistic range to tunneling magnetoresistance."
    image: /images/paper-stories/configurable-p-neurons/figure-4.webp
    page: 3
  - title: Test modularity on digital hardware.
    text: FPGA experiments realize several activation functions and examine stochastic-unit sharing. A small p-AND network
      checks functional behavior, while resource comparisons show the hardware implications of sharing the random-number source.
    notes:
    - label: "Panels (a)–(h)"
      text: "The first four panels show measured average responses for digital tanh, sigmoid, ReLU, and linear neurons. The corresponding designs underneath compare a digital input with a random number supplied by the stochastic unit."
    - label: "Panels (i)–(m)"
      text: "The hardware photograph and sharing diagrams connect those responses to FPGA experiments. The p-AND example uses three neurons sharing one random-number source; its state histogram is compared with the expected Boltzmann distribution."
    - label: "Panels (n) and (o)"
      text: "Resource-utilization and transistor-count comparisons quantify the architectural motivation. Read these alongside the sharing experiments: the reduction comes from reusing stochastic resources, while each neuron retains its own activation path."
    image: /images/paper-stories/configurable-p-neurons/figure-5.webp
    page: 4
  conclusion_title: Modularity as a circuit design tool.
  conclusion: Separating the stochastic and activation paths creates configurable building blocks. The digital experiments
    connect that modularity to functional networks and reduced hardware resource requirements.
  related:
  - paoaSPAD
  - paoa
defect-aware-2d-memristors:
  summary: A bottom-up statistical framework links atomic defects to memristor yield, switching voltage, and scaling limits.
  introduction: Making a switching layer thinner does not remove the randomness of its defects. This paper builds a framework
    from defect statistics upward, then checks device-level predictions and explores what changes at extreme miniaturization.
    Its figures connect atomic structure to manufacturing-relevant behavior.
  figures:
  - title: Connect defects, materials, and devices.
    text: 'The framework moves through several levels of description: individual defect behavior, spatial material statistics,
      and the response of a complete device. This organization links microscopic assumptions to quantities such as yield and
      operating voltage.'
    notes:
    - label: "Panel (a) and panels (d)–(f)"
      text: "The framework starts with an individual defect and a switching structure, then moves to microscopy and spatial maps of many defects. The material model connects atom-scale information to a statistical description of the film."
    - label: "Panels (g) and (c)"
      text: "The device model assigns switching behavior to a realization of defects. Measurements across multiple devices then constrain its statistical parameters; the displayed yield data represent a device population, rather than a single switching trace."
    - label: "Panel (b)"
      text: "The crossbar illustration is the final scale of the framework. Devices within an array can contain different defect realizations, so predictions of yield and variability must carry the underlying stochastic model through to the array level."
    image: /images/paper-stories/defect-aware-2d-memristors/figure-1.webp
    page: 20
  - title: Represent atomic defects statistically.
    text: Poisson and hard-core point processes describe different spatial assumptions about defects. Comparing these models
      shows when exclusion distances matter and how physically constrained defect distributions differ from unconstrained
      random placement.
    notes:
    - label: "Panels (a)–(c)"
      text: "A Poisson point process supplies a starting spatial model, while the h-BN lattice introduces a minimum separation between admissible vacancy locations. An unconstrained random placement need not respect that atomic distance."
    - label: "Panels (d) and (e)"
      text: "The hard-core construction removes points that violate the separation rule. Black points in the construction are removed; retained red points form the constrained realization shown separately in the next panel."
    - label: "Panel (f)"
      text: "The density comparison shows how the Poisson and hard-core models diverge as defects become crowded. The saturation bound and constraint-violation probability identify when an unconstrained spatial approximation becomes physically problematic."
    image: /images/paper-stories/defect-aware-2d-memristors/figure-2.webp
    page: 22
  - title: Predict monolayer device behavior.
    text: The model connects device area and defect density to intrinsic yield, switching-voltage distributions, and variability
      in monolayer h-BN memristors. Experimental comparisons provide a check on the statistical predictions.
    notes:
    - label: "Panels (a)–(e)"
      text: "The device schematic and defect realization connect the material model to intrinsic yield and variability. Area and defect density control how many potential switching sites a device contains."
    - label: "Panels (f)–(h)"
      text: "Applied-voltage yield curves become switching-voltage distributions and an area-dependent voltage prediction. Experimental points provide the comparison for the probabilistic device model."
    image: /images/paper-stories/defect-aware-2d-memristors/figure-3.webp
    page: 24
  - title: Extend the model to multilayer devices.
    text: A multilayer switching path changes which defects must participate in conduction. The figure applies the framework
      to multilayer h-BN devices and compares area-dependent predictions with measured switching behavior.
    notes:
    - label: "Panels (a)–(d)"
      text: "The multilayer switching structure is followed by area-dependent yield curves, voltage distributions, and voltage/variability summaries at fixed defect density."
    - label: "Panels (e)–(h)"
      text: "Measured switching statistics anchor the model. Holding area fixed while changing defect density then separates a material-distribution effect from the device-area sweep above."
    image: /images/paper-stories/defect-aware-2d-memristors/figure-4.webp
    page: 25
  - title: Examine extreme miniaturization.
    text: Nanoscale characterization and model extrapolations probe the consequences of reducing device area. The results
      distinguish a device being able to switch from it doing so with favorable voltage and device-to-device variability.
    notes:
    - label: "Panels (a), (b), and (d)"
      text: "Conductive-AFM measurements connect nanoscale switching voltages to films with different measured defect densities. The current maps are thresholded to make individual defects visible; the voltage plot includes experimental variability."
    - label: "Panel (c)"
      text: "The spatial realizations shrink the device area while marking defects by their activation voltage. Smaller devices contain fewer candidate switching sites, so different defect realizations can lead to different device responses."
    - label: "Panels (e)–(g)"
      text: "Operational-yield curves are translated into switching-voltage distributions and then into mean voltage and standard deviation. Reading all three separates the chance of switching from the spread of voltages among devices."
    image: /images/paper-stories/defect-aware-2d-memristors/figure-5.webp
    page: 26
  conclusion_title: Scaling needs a statistical description.
  conclusion: The same defect population influences yield, voltage, and variability in different ways. Evaluating those quantities
    together makes the tradeoffs of miniaturization more explicit than a dimensional scaling argument alone.
  related:
  - hbn-memristors-scalability
hbn-memristors-scalability:
  summary: An early study of the yield and variability tradeoffs in scaling h-BN memristors.
  introduction: How do randomly located defects affect the reliability of an increasingly small memristor? This conference
    paper begins with a spatial defect model, connects it to measured switching behavior, and follows the consequences of
    reducing area for monolayer and multilayer devices.
  figures:
  - title: Start with a spatial model of defects.
    text: The schematic, microscopy example, and stochastic realization introduce the physical origin of switching sites.
      The modeling steps connect the distribution of those sites to the probability of obtaining an operational device.
    notes:
    - label: "Panels (a) and (b)"
      text: "The defect schematic and conductive-AFM image motivate a spatial model: switching-relevant sites are distributed across the material, rather than guaranteed to appear in the same place in every device."
    - label: "Panels (c) and (d)"
      text: "The point-process realization is a mathematical representation of those locations. The lattice drawing adds the atomic-scale constraint that neighboring vacancy sites cannot be arbitrarily close together."
    - label: "Panel (e)"
      text: "The density plot compares the Poisson model with two hard-core processes and a saturation limit. Its second axis tracks the Poisson model’s distance-constraint violations. This explains where a convenient random-placement model needs a physical correction."
    image: /images/paper-stories/hbn-memristors-scalability/figure-1.webp
    page: 2
  - title: Relate intrinsic yield to density and area.
    text: A smaller device contains fewer possible switching sites. These curves show how the intrinsic yield and its variability
      change with both defect density and device area, including the high-yield regime.
    notes:
    - label: "Panels (a)–(c)"
      text: "The yield sweep, high-yield enlargement, and coefficient of variation separate the probability of having defects from variability between device realizations."
    image: /images/paper-stories/hbn-memristors-scalability/figure-2.webp
    page: 2
  - title: Check monolayer switching predictions.
    text: Area-dependent switching-voltage curves are fitted to reported monolayer measurements and then extrapolated. The
      comparison connects the spatial defect model to an experimentally measurable operating quantity.
    notes:
    - label: "Panels (a)–(c)"
      text: "Operational yield is converted into a voltage distribution, then compared with measured switching voltage across device areas. This tests voltage predictions as well as yield."
    image: /images/paper-stories/hbn-memristors-scalability/figure-3.webp
    page: 2
  - title: Move to multilayer devices.
    text: The multilayer case uses measured voltage-dependent yield to calibrate the model. Predicted curves then examine
      how changes in defect density and device area shift the operational response.
    notes:
    - label: "Panels (a)–(c)"
      text: "Measured multilayer-device statistics establish the fit. Subsequent model sweeps change device area and defect density separately to expose their distinct effects."
    image: /images/paper-stories/hbn-memristors-scalability/figure-4.webp
    page: 2
  - title: Expose the variability tradeoff.
    text: The final panels bring together variation, average SET voltage, and standard deviation across area scales. Reading
      them together shows why a high switching yield alone is not a complete measure of device quality.
    notes:
    - label: "Panels (a)–(c)"
      text: "Coefficient of variation, mean SET voltage, and standard deviation are plotted against device area. The three measures distinguish relative spread from the absolute voltage scale."
    - label: "Panels (d)–(f)"
      text: "The same quantities are then plotted against defect density at fixed area. Comparing the two rows shows why improving one variability measure cannot be interpreted without the corresponding voltage and geometry."
    image: /images/paper-stories/hbn-memristors-scalability/figure-5.webp
    page: 2
  conclusion_title: An initial step toward defect-aware scaling.
  conclusion: The conference study makes yield and variability part of the same scaling problem. The later defect-aware framework
    develops this direction into a broader bottom-up description.
  related:
  - defect-aware-2d-memristors
adaptive-regularization-portfolio:
  summary: Adaptive regularization improves covariance-based minimum-variance portfolio estimation under noisy observations.
  introduction: The minimum-variance portfolio depends on an inverse covariance matrix, which can amplify estimation noise.
    This paper reformulates the weights and adapts the regularization parameter to the observed returns. Two data experiments
    examine the resulting realized risk across training-window lengths and added noise levels.
  figures:
  - title: Evaluate realized risk on the first asset set.
    text: The first experiment uses 45 Hang Seng Index assets observed from 2010 to 2011. Each panel varies the added noise
      level, comparing annualized realized risk across training-window lengths and competing covariance-regularization methods.
    notes:
    - label: "The four plots"
      text: "The panels add Gaussian return noise with standard deviations 0, 0.02, 0.04, and 0.06. Each plots annualized realized risk against the training-window length for the 2010–2011 asset set."
    - label: "What to compare"
      text: "Lower risk is the evaluation criterion. Comparing methods at the same window length and noise setting tests sensitivity to noisy returns, rather than comparing different training histories."
    image: /images/paper-stories/adaptive-regularization-portfolio/figure-1.webp
    page: 4
  - title: Repeat the comparison on a second period.
    text: A second experiment uses 50 Hang Seng Index assets from 2016 to 2017. Repeating the noise and training-window comparisons
      checks whether the behavior carries over to a different asset set and time period.
    notes:
    - label: "A second dataset"
      text: "The same four noise settings are evaluated on the 2016–2017 period with 50 assets. The repeated design checks whether the pattern from the earlier period persists on another dataset."
    - label: "Reading the curves"
      text: "Compare methods within each panel before comparing noise levels. These are realized-risk results for the tested historical datasets, rather than a guarantee about future portfolio performance."
    image: /images/paper-stories/adaptive-regularization-portfolio/figure-2.webp
    page: 4
  conclusion_title: Adapt the estimator to the observations.
  conclusion: The figures evaluate the proposal through out-of-sample realized risk rather than matrix estimation alone. The
    central idea is to make the regularization parameter respond to the data used to construct the portfolio.
  related: []
delay-eigenvalue-coupled-oscillators:
  summary: A comparison of numerical methods for the eigenvalues of delayed coupled oscillators.
  introduction: Delayed interactions turn a familiar oscillator problem into a transcendental eigenvalue problem. This study
    compares four approximation strategies against a shared physical model, separating their predictions for the real and
    imaginary parts of the fundamental eigenfrequencies.
  figures:
  - title: Define one physical problem for every method.
    text: Two coupled mass–spring oscillators provide the common test system. A delay in the interaction changes the characteristic
      equation, making the calculation of dynamical eigenvalues more demanding than in the instantaneous case.
    notes:
    - label: "The common benchmark"
      text: "The wall springs, masses, and coupling define one mechanical system for every solver. An external force acts on the first mass to initiate the response."
    image: /images/paper-stories/delay-eigenvalue-coupled-oscillators/figure-1.webp
    page: 4
  - title: Compare the real components of the eigenvalues.
    text: Taylor expansion, Rekasius substitution, self-consistent iteration, and Chebyshev discretization are evaluated as
      the delay varies. The real components reveal the predicted growth or decay behavior and where the approximations diverge.
    notes:
    - label: "Panels (a)–(d)"
      text: "Taylor expansion, Rekasius substitution, self-consistent iteration, and Krylov approximation are applied to the same delay-dependent real components."
    image: /images/paper-stories/delay-eigenvalue-coupled-oscillators/figure-2.webp
    page: 6
  - title: Compare the imaginary components.
    text: The corresponding imaginary components describe the oscillatory part of the modes. Viewing them alongside the real
      components exposes differences between methods that a single stability metric could miss.
    notes:
    - label: "Panels (a)–(d)"
      text: "The same method order is retained for the imaginary components, allowing each solver’s frequency branches to be read alongside its real-part result."
    image: /images/paper-stories/delay-eigenvalue-coupled-oscillators/figure-3.webp
    page: 7
  conclusion_title: Choose a solver by the dynamics it must resolve.
  conclusion: Using the same oscillator model makes the numerical methods directly comparable. Real and imaginary eigenvalue
    components provide complementary checks on the behavior predicted by each approximation.
  related:
  - coupled-oscillators-delay
coupled-oscillators-delay:
  summary: Delayed classical oscillators provide a model for energy exchange, coherence, and stability.
  introduction: Two coupled oscillators can exchange energy in ways that resemble a two-level system. Adding a delay changes
    the mode spectrum and stability of that exchange. The paper follows the connection from a mechanical model through eigenvalue
    structure to time-domain energy dynamics.
  figures:
  - title: Define the delayed oscillator pair.
    text: A two-mass spring model establishes the degrees of freedom, damping, and coupling. It provides a classical setting
      in which the consequences of finite interaction delay can be studied explicitly.
    notes:
    - label: "Model components"
      text: "The masses and wall springs define the uncoupled oscillators; the coupling and damping terms determine how their motion interacts and decays."
    image: /images/paper-stories/coupled-oscillators-delay/figure-1.webp
    page: 3
  - title: See the spectral modes without delay.
    text: Power spectra for several history functions establish the reference response. Detuning changes which modes are excited
      and how their resonances appear in the total spectral density.
    notes:
    - label: "Upper and lower panels"
      text: "The upper spectra use zero delay; the lower spectra use a delay of 0.1. Different history functions excite different mode combinations, so comparing rows separates delay effects from the initial preparation."
    image: /images/paper-stories/coupled-oscillators-delay/figure-2.webp
    page: 6
  - title: Connect the spectrum to energy trajectories.
    text: The oscillator energies are plotted for different initial histories. These time-domain examples show how the chosen
      preparation changes the visible exchange between the two subsystems.
    notes:
    - label: "Panels (a)–(c)"
      text: "Three history functions prepare the same coupled system differently. Following both energy curves shows how the preparation changes the observed exchange without changing the model parameters."
    image: /images/paper-stories/coupled-oscillators-delay/figure-3.webp
    page: 7
  - title: Track damping through spectral linewidths.
    text: Linewidths of the coupled modes are compared across damping rates and delays. This connects the spectral response
      to the persistence of the oscillations.
    notes:
    - label: "Upper and lower panels"
      text: "The upper plots follow the second eigenstate and the lower plots the first. Comparing delays at the same damping rate reveals changes in spectral linewidth."
    image: /images/paper-stories/coupled-oscillators-delay/figure-4.webp
    page: 7
  - title: Follow the delayed eigenvalue spectrum.
    text: The complex spectrum is plotted for different couplings and delays. Moving beyond the instantaneous model reveals
      additional structure in the possible dynamical modes.
    notes:
    - label: "Across the six rows"
      text: "The coupling increases from one quarter of the damping rate to one hundred times that rate. Within each row, colors distinguish delays from 0.3 to 1.0, allowing the displacement of the spectrum to be separated from a change in coupling."
    - label: "The red circles"
      text: "The two highlighted roots are the main dynamical modes followed in the later figures. Their horizontal position gives the growth or decay rate, while their vertical position gives the oscillation frequency."
    - label: "Reading the comparison"
      text: "Use the same axes to compare the circled pair with the other roots. The figure establishes which part of the spectrum is being tracked before subsequent plots focus on the dominant pair and the stability boundary."
    image: /images/paper-stories/coupled-oscillators-delay/figure-5.webp
    page: 8
  - title: Resolve the principal eigenvalues as delay changes.
    text: Real and imaginary parts of the main modes are followed across delay. Their trajectories distinguish changes in
      oscillation frequency from changes in stability or decay.
    notes:
    - label: "Real and imaginary components"
      text: "The two plots separate changes in decay or growth from changes in oscillation frequency. Solid and dashed curves of the same color identify the two main modes at a fixed coupling."
    - label: "The stability boundary"
      text: "The black zero-real-part line marks the transition between decay and growth. Comparing the three coupling choices—half, equal to, and twice the damping rate—shows why frequency splitting alone does not establish stable dynamics."
    image: /images/paper-stories/coupled-oscillators-delay/figure-6.webp
    page: 9
  - title: Identify the modes that control long-time behavior.
    text: The rightmost eigenvalues determine whether a mode grows or decays most slowly. Comparing coupling strengths exposes
      how the dominant dynamical behavior changes with delay.
    notes:
    - label: "Top row"
      text: "The imaginary parts track oscillation frequencies as normalized delay changes. Following both branches reveals how the dominant pair evolves across the tested coupling strengths."
    - label: "Middle and bottom rows"
      text: "Positive real parts are plotted separately from negative real parts. That separation makes unstable growth distinguishable from damped motion, even when their frequency branches look similar."
    image: /images/paper-stories/coupled-oscillators-delay/figure-7.webp
    page: 10
  - title: View mode evolution in the complex plane.
    text: The eigenvalue paths offer another representation of the same delayed dynamics. Their geometry clarifies how conjugate
      modes move as the interaction delay varies.
    notes:
    - label: "Panels (a) and (b)"
      text: "These trajectories follow the upper pair of coupled modes in the complex plane. Read horizontal displacement as a change in the real part and vertical displacement as a change in frequency."
    - label: "Panels (c) and (d)"
      text: "The lower panels show the corresponding conjugate modes. Viewing the pairs together links the separate real- and imaginary-part plots to complete eigenvalue trajectories as delay varies."
    image: /images/paper-stories/coupled-oscillators-delay/figure-8.webp
    page: 10
  - title: Summarize the geometry of the mode paths.
    text: A schematic condenses the evolution into circles and interwinding trajectories. It provides a visual guide to the
      more detailed eigenvalue plots that precede it.
    notes:
    - label: "Reading the schematic"
      text: "The circles summarize the mode paths in the preceding complex-plane plots. Their overlap and interwinding organize the recurring evolution with delay; the drawing is a geometric guide to those trajectories, rather than another time-domain measurement."
    image: /images/paper-stories/coupled-oscillators-delay/figure-9.webp
    page: 11
  - title: Locate intervals of instability.
    text: The stability map gathers intervals in which eigenvalues imply growing motion. Comparing different coupling strengths
      shows how stable and unstable delay ranges alternate.
    notes:
    - label: "Stable intervals"
      text: "Gray intervals in the upper panel mark stable dynamics. Comparing their widths and locations as coupling increases makes the repeated stable and unstable delay regions easier to identify than in individual root plots."
    - label: "Connection to the spectrum"
      text: "These intervals summarize where the leading eigenvalues have the sign required for decay. They should be read together with the real-part plots, which show how a mode reaches the stability boundary."
    image: /images/paper-stories/coupled-oscillators-delay/figure-10.webp
    page: 11
  - title: Connect stability boundaries to bifurcation.
    text: A bifurcation diagram plots the critical coupling against normalized delay. It connects the observed stability transitions
      with the boundary predicted by the dynamical analysis.
    notes:
    - label: "Curve and markers"
      text: "The black bifurcation boundary plots critical coupling against normalized delay. Red circles evaluate the derived stability condition, providing a direct check against that boundary."
    image: /images/paper-stories/coupled-oscillators-delay/figure-11.webp
    page: 12
  - title: Revisit the spectrum in the delayed regime.
    text: Power-density plots compare several coupling cases and history functions as delay varies. They connect changes in
      the eigenvalue picture to observable spectral features.
    notes:
    - label: "Rows and columns"
      text: "The rows correspond to the two eigenstates. The three coupling choices—half, equal to, and twice the damping rate—show how the delay-dependent spectra change across the coupling boundary."
    image: /images/paper-stories/coupled-oscillators-delay/figure-12.webp
    page: 12
  - title: Measure energy exchange and coherence.
    text: The exchange frequency and coherence time are mapped across coupling and delay. These quantities summarize how quickly
      energy moves and how long the exchange remains discernible.
    notes:
    - label: "Panel (a)"
      text: "The energy-exchange frequency is plotted against both coupling and delay. It describes how quickly energy moves between the oscillators; it is a different quantity from the individual oscillators’ carrier frequencies."
    - label: "Panel (b)"
      text: "The coherence-time surface measures how long the exchange remains coherent under the same parameter variation. Comparing the surfaces separates a faster transfer process from a longer-lived one."
    image: /images/paper-stories/coupled-oscillators-delay/figure-13.webp
    page: 13
  - title: Inspect trajectories near the coupling boundary.
    text: Time traces compare the individual oscillator energies for couplings around the damping scale. The cases place the
      abstract coherence and stability measures back into direct energy dynamics.
    notes:
    - label: "Across the rows"
      text: "The coupling is 0.9, 1.0, and 1.1 times the damping rate. These closely spaced choices probe the region around the coupling boundary instead of comparing only widely separated regimes."
    - label: "Across the columns"
      text: "The left and right columns use normalized delays of zero and π/2. Each plot follows both oscillator energies, making the effect of delay visible at the same coupling."
    image: /images/paper-stories/coupled-oscillators-delay/figure-14.webp
    page: 13
  - title: Compare weak and stronger coupling in time.
    text: The final trajectories broaden the coupling comparison and contrast instantaneous with delayed interaction. They
      complete the connection between the spectrum, stability, and the observed energy exchange.
    notes:
    - label: "Panels (a), (c), (e), and (g)"
      text: "The left column shows the first oscillator’s energy. From top to bottom, coupling rises from 0.5 to 1, 5, and 10 times the damping rate, while each surface varies time and delay."
    - label: "Panels (b), (d), (f), and (h)"
      text: "The right column follows the second oscillator under the matching conditions. Compare each row as a pair to see transferred energy alongside the energy remaining in the first oscillator."
    - label: "Reading the surfaces"
      text: "The oscillatory exchange becomes more apparent in the stronger-coupling rows. The plotted delay range also changes between rows, so matching the axes matters when comparing the extent and persistence of the oscillations."
    image: /images/paper-stories/coupled-oscillators-delay/figure-15.webp
    page: 14
  conclusion_title: One model, several views of the dynamics.
  conclusion: Spectra, eigenvalues, stability maps, and energy trajectories describe complementary aspects of the same system.
    Delay links these views by changing both the allowed modes and the coherence of their energy exchange.
  related:
  - delay-eigenvalue-coupled-oscillators
wur-aerial-data-demo:
  summary: A working prototype uses a UAV wake-up call to activate low-power IoT sensing and data collection.
  introduction: An IoT node need not stay fully awake while waiting for a data-collection visit. This demonstration combines
    an addressed wake-up receiver, a UAV-carried transmitter, and a dashboard. Its figures document the system, outdoor range
    testing, the sensing board, and the end-to-end demonstration.
  figures:
  - title: Connect sensing, flight, and the dashboard.
    text: The system diagram follows the wake-up signal from the UAV to an IoT device, then follows the collected data to
      the base station and user interface. It also shows the hardware path used to detect an addressed wake-up call.
    notes:
    - label: "System path"
      text: "The UAV activates a ground device through the wake-up link, then relays its measurements toward the base station and dashboard. The arrows distinguish activation from sensed-data transfer."
    - label: "Receiver detail"
      text: "The inset places signal conditioning and address detection before the main sensing and communication circuitry. This separation explains how the device can wait for a call without keeping its full data path active."
    image: /images/paper-stories/wur-aerial-data-demo/figure-1.webp
    page: 3
  - title: Take the wake-up link outdoors.
    text: The field setup places the transmitter on a UAV and the receiving node on the ground. This makes aerial reach and
      alignment part of the practical system test.
    notes:
    - label: "Outdoor arrangement"
      text: "The transmitter is carried by the UAV while the receiver is part of the ground IoT node. This places the wake-up mechanism in the geometry relevant to aerial data collection, beyond an instrument-only bench test."
    - label: "What is evaluated"
      text: "The experiment tests successful device wake-up as the aircraft’s position changes. The later height-versus-offset plot is needed to interpret the operating range; the setup photograph establishes where the transmitting and receiving hardware are located."
    image: /images/paper-stories/wur-aerial-data-demo/figure-2.webp
    page: 3
  - title: Build the sensing node.
    text: The board brings together sensors, a microcontroller, a data transceiver, and the wake-up receiver. These components
      allow a sleeping node to respond to a call and then transmit its measurements.
    notes:
    - label: "Board functions"
      text: "The labeled blocks locate the microcontroller, wake-up receiver, data transceiver, battery, and sensor connections. They show the complete sensing node used in the demonstration."
    image: /images/paper-stories/wur-aerial-data-demo/figure-3.webp
    page: 3
  - title: Measure the effect of horizontal misalignment.
    text: The maximum wake-up height is plotted as the UAV moves away from direct alignment with the device. The result turns
      a laboratory communication link into a deployment constraint.
    notes:
    - label: "Geometry and range"
      text: "The vertical axis is the maximum successful wake-up height; the horizontal axis is sideways offset from the device. Each point describes a different link geometry, rather than flight time."
    - label: "Observed trend"
      text: "The tested height falls as offset increases. This distinguishes the favorable overhead case from operation farther to one side, where greater separation and antenna alignment constrain the link."
    image: /images/paper-stories/wur-aerial-data-demo/figure-4.webp
    page: 3
  - title: Follow a measurement through the software stack.
    text: The data-flow diagram connects flight control, sensing, the base station, a cloud database, and the dashboard. It
      shows how the radio event becomes information visible to a user.
    notes:
    - label: "Measurements and commands"
      text: "Measurements move through the UAV/base-station link to a Firebase database and dashboard. The command path lets the interface request an intended node, with Node-RED linking the software components."
    image: /images/paper-stories/wur-aerial-data-demo/figure-5.webp
    page: 4
  - title: Assemble the end-to-end demonstration.
    text: The workstation setup places monitoring and control interfaces alongside the physical electronics. This is the integration
      step that connects individual working components into a usable system.
    notes:
    - label: "Demonstration setup"
      text: "The raised transmitter emulates the UAV side during an indoor demonstration. The laptop and displays show the collected data and interface, allowing the wake-up/data sequence to be inspected without flying an aircraft in the venue."
    image: /images/paper-stories/wur-aerial-data-demo/figure-6.webp
    page: 4
  - title: Demonstrate the wake-up transaction.
    text: The final photographs show the IoT node and a controlled UAV-emulation setup. They document the practical activation
      and data-collection process used in the demo.
    notes:
    - label: "The sensing device"
      text: "The 7 × 7 cm² IoT board combines the low-power wake-up path with the circuitry needed to acquire and transmit measurements. The board is the end device being activated, rather than a stand-in for the radio link."
    - label: "The demonstration"
      text: "The setup emulates the UAV-side wake-up transaction so visitors can follow activation and data collection. This makes the sequence inspectable in a demonstration setting, alongside the separate outdoor range experiments."
    image: /images/paper-stories/wur-aerial-data-demo/figure-7.webp
    page: 4
  conclusion_title: An end-to-end proof of implementation.
  conclusion: The demonstration establishes a complete wake-up-and-collect workflow. The later journal study expands this
    foundation with device engineering, reliability analysis, and large-scale network modeling.
  related:
  - aerial-data-aggregation
aerial-data-aggregation:
  summary: From an implemented wake-up-radio prototype to reliability and large-scale aerial IoT analysis.
  introduction: Keeping remote sensors awake wastes energy, but sleeping through a UAV visit loses data. This study develops
    an addressed wake-up-radio system, validates the hardware, and then connects the prototype to models of timing, reliability,
    and deployment at network scale.
  figures:
  - title: Start with the full collection system.
    text: The architecture connects the UAV wake-up transmitter, sleeping IoT node, base station, database, and dashboard.
      It establishes the path that later hardware and analytical results must support.
    notes:
    - label: "Wake-up and data paths"
      text: "The wake-up call travels from the UAV to the ground device; the sensed data travels back toward the UAV and base station. These arrows separate the low-power activation mechanism from the main data-transfer link."
    - label: "Ground infrastructure"
      text: "The base station organizes the collected measurements and uploads them to a cloud database. The dashboard completes the path to the user, making the figure an end-to-end system diagram rather than only a radio-link sketch."
    image: /images/paper-stories/aerial-data-aggregation/figure-1.webp
    page: 4
  - title: Design the low-power IoT node.
    text: The block diagram separates wake-up detection, addressing, sensing, and data transmission. A successful wake-up
      event activates the functions that would otherwise consume power while the node waits.
    notes:
    - label: "Upper signal path"
      text: "The subcarrier-modulation input stage contains matching, rectification, and filtering blocks before the commercial wake-up receiver. The receiver then detects an address and issues the wake-up signal."
    - label: "Lower device blocks"
      text: "The microcontroller, sensors, memory, and data transceiver perform the sensing and reporting task after activation. Separating these functions explains how the wake-up path can remain available while more power-hungry circuitry sleeps."
    image: /images/paper-stories/aerial-data-aggregation/figure-2.webp
    page: 4
  - title: Create an addressable wake-up waveform.
    text: Subcarrier modulation lets a higher-frequency transmitted signal deliver the lower-frequency pattern expected by
      the wake-up receiver. The waveform connects the radio carrier to the decoded binary message.
    notes:
    - label: "Carrier and envelopes"
      text: "The drawing starts with an 868 MHz subcarrier and shows the lower-frequency envelope recovered from it. A subsequent detection stage exposes the on–off keyed message used by the wake-up receiver."
    - label: "Reading the bit sequence"
      text: "Compare the high-frequency oscillations with the slower binary envelope above them. The receiver needs the address-bearing message, rather than the original radio-frequency waveform, which motivates the passive input-stage demodulation."
    image: /images/paper-stories/aerial-data-aggregation/figure-3.webp
    page: 5
  - title: Implement the receiver input stage.
    text: Matching, envelope detection, and low-pass filtering translate the received signal into a form the wake-up receiver
      can use. The schematic makes the signal-processing path explicit.
    notes:
    - label: "Three circuit stages"
      text: "The matching network couples the antenna to the input; the envelope detector rectifies the signal; the low-pass filter retains the lower-frequency carrier needed by the wake-up receiver."
    image: /images/paper-stories/aerial-data-aggregation/figure-4.webp
    page: 5
  - title: Build the transmitter and receiver hardware.
    text: Photographs show the developed IoT device and wake-up transmitter. This step turns the earlier architecture and
      circuit descriptions into physical components for testing.
    notes:
    - label: "The transmitter"
      text: "The CC1101-based wake-up transmitter and its dipole antenna implement the radio side of the wake-up call. The IoT board provides the corresponding receiver-side hardware, connecting the earlier block diagrams to assembled components."
    - label: "Why both boards matter"
      text: "An operational wake-up link depends on the transmitter waveform, antenna, input stage, and receiver together. The photograph documents the prototype used for the following bench, indoor, and aerial experiments; it is not a chip-level integration claim."
    image: /images/paper-stories/aerial-data-aggregation/figure-5.webp
    page: 6
  - title: Make the measurements accessible.
    text: The mobile interface presents sensed data and system controls. It provides the user-facing endpoint of the otherwise
      hardware-centered data-collection pipeline.
    notes:
    - label: "Sensor view"
      text: "The sensor screen displays collected measurements, completing the path from the ground node through the UAV and base station to the user."
    - label: "Control and home views"
      text: "The IoT control screen supports addressed wake-up requests. The remaining view provides navigation among the application’s functions, making the dashboard part of the operational system rather than only a results display."
    image: /images/paper-stories/aerial-data-aggregation/figure-6.webp
    page: 7
  - title: Integrate the sensing board.
    text: The annotated prototype identifies the microcontroller, sensor interfaces, wake-up module, power source, and data
      radio. The layout shows how the required functions fit on the actual device.
    notes:
    - label: "Hardware integration"
      text: "The photograph identifies the data transceiver, microcontroller, wake-up receiver, input stage, battery holder, and free sensor pins. Their placement documents how the low-power wake-up path is integrated with a functioning sensing node."
    image: /images/paper-stories/aerial-data-aggregation/figure-7.webp
    page: 7
  - title: Check the wake-up signal on the bench.
    text: The laboratory setup uses a signal generator and oscilloscope to test subcarrier modulation with the IoT node. This
      isolates the receive path before outdoor deployment.
    notes:
    - label: "Signal source"
      text: "The microwave signal generator supplies a carrier swept around the intended 868 MHz operating frequency. This isolates the subcarrier-modulation input stage before the complete wake-up protocol is tested."
    - label: "Measurement"
      text: "The oscilloscope observes the receiver input-stage output. With a continuous carrier and no slower modulation envelope, rectification and low-pass filtering produce an approximately DC output, so the test checks the input stage’s frequency response."
    - label: "Scope of this test"
      text: "This is a bench characterization of the signal-conditioning path. The separate indoor and aerial experiments are needed to establish how the complete wake-up link behaves over distance."
    image: /images/paper-stories/aerial-data-aggregation/figure-8.webp
    page: 8
  - title: Inspect the transmitted wake-up call.
    text: Oscilloscope traces expose the carrier burst, preamble, and address pattern. These measurements check that the transmitted
      signal contains the structure expected by the receiver.
    notes:
    - label: "Panel (a)"
      text: "The complete transmitted wake-up call contains the carrier burst, preamble, and address pattern. Reading these in order shows how a receiver is prepared and then given an identification-bearing message."
    - label: "Panels (b) and (c)"
      text: "The lower panels zoom into the 125 kHz on–off keyed carrier and the 868 MHz subcarrier. They are different time scales of the same transmitted waveform, rather than two independent communication experiments."
    image: /images/paper-stories/aerial-data-aggregation/figure-9.webp
    page: 8
  - title: Measure the indoor communication link.
    text: The indoor range experiment tests the transmitter and receiving node in a controlled environment. It provides a
      practical reference before moving to the aerial configuration.
    notes:
    - label: "Test arrangement"
      text: "The wake-up transmitter is placed across the room from the assembled IoT device and its receiver. This checks the complete link after the input stage has been characterized on the bench."
    - label: "What changes between tests"
      text: "The indoor experiment changes separation between the transmitter and receiver. It precedes the aerial test, where antenna alignment and UAV motion introduce additional conditions that a room-scale stationary setup does not capture."
    - label: "Reading the photograph"
      text: "The labeled receiver is part of the powered IoT prototype. Successful wake-up refers to activating that device through the wake-up path, not merely observing an RF signal at an instrument input."
    image: /images/paper-stories/aerial-data-aggregation/figure-10.webp
    page: 8
  - title: Move the transmitter onto a UAV.
    text: The outdoor setup combines a flying transmitter with the deployed IoT node. It tests the intended data-collection
      geometry rather than a fixed bench arrangement.
    notes:
    - label: "On the UAV"
      text: "The wake-up transmitter and antenna are attached to the aircraft for outdoor measurements. The inset identifies the transmitter assembly, distinguishing the wake-up hardware from the UAV itself."
    - label: "On the ground"
      text: "The deployed IoT device is the target of the wake-up calls. The experiment varies height and horizontal offset to determine when the assembled device can still be activated."
    - label: "From setup to result"
      text: "The reported stable wake-up height reaches 23 m in the tested arrangement. The next figure shows how that reach falls with horizontal misalignment; the photograph alone should not be read as a general range specification."
    image: /images/paper-stories/aerial-data-aggregation/figure-11.webp
    page: 8
  - title: Quantify aerial reach and misalignment.
    text: The measured wake-up height decreases as horizontal separation grows. That geometry becomes important when specifying
      how closely the UAV must pass a sensor.
    notes:
    - label: "Reading the axes"
      text: "The horizontal axis is the UAV’s offset from the ground device; the vertical axis is the maximum height at which wake-up still succeeds. Each point represents a tested geometry, rather than a trajectory through time."
    - label: "What the trend means"
      text: "The available wake-up height drops as the UAV moves sideways. Greater separation and a less favorable line-of-sight geometry reduce the received signal, so directly overhead range cannot be assumed at every horizontal offset."
    image: /images/paper-stories/aerial-data-aggregation/figure-12.webp
    page: 8
  - title: Define a reliable communication window.
    text: A UAV is only within range for a limited interval, and a duty-cycled sensor is active for only part of that time.
      The timing diagram explains why overlap determines successful communication.
    notes:
    - label: "Three time intervals"
      text: "The device’s active interval must fit within the UAV’s available communication time. The reliable arrival window identifies timings that leave enough overlap to complete the exchange."
    image: /images/paper-stories/aerial-data-aggregation/figure-13.webp
    page: 9
  - title: Connect timing to flight geometry.
    text: The path diagram relates UAV travel distance, radio range, and horizontal misalignment. It provides the geometry
      needed to translate speed into an available communication time.
    notes:
    - label: "Flight geometry"
      text: "The path crosses the device’s communication disk with a horizontal offset. Increasing that offset shortens the traversed chord and therefore the available contact time at a fixed UAV speed."
    image: /images/paper-stories/aerial-data-aggregation/figure-14.webp
    page: 9
  - title: Expose the lifetime–reliability tradeoff.
    text: Increasing the sleep period extends battery life but reduces the chance that an ordinary duty-cycled node catches
      the UAV visit. The two curves make the competing effects visible.
    notes:
    - label: "Two vertical axes"
      text: "The blue curve tracks communication reliability and the red curve battery lifetime as the duty-cycle sleep period increases. The same setting must be read against both outcomes."
    - label: "The tradeoff"
      text: "Longer sleep saves energy but increases the chance of missing the aircraft’s communication window. The plot therefore connects a battery-life benefit to a loss in timely availability."
    image: /images/paper-stories/aerial-data-aggregation/figure-15.webp
    page: 11
  - title: See what faster flight changes.
    text: Communication reliability is plotted against UAV speed for the duty-cycled baseline. A shorter contact window makes
      missed visits more likely, motivating an on-demand wake-up mechanism.
    notes:
    - label: "What is held fixed"
      text: "The plot varies UAV speed within the duty-cycled communication model. A faster aircraft spends less time within the device’s usable range, leaving fewer opportunities for a scheduled active interval to overlap."
    - label: "How to read the result"
      text: "The falling curve concerns successful communication during that contact window. It does not describe a change in the device’s radio sensitivity or the aircraft’s ability to transmit."
    image: /images/paper-stories/aerial-data-aggregation/figure-16.webp
    page: 11
  - title: Scale the model to a sensor field.
    text: The system model expands from one UAV–sensor link to a spatial deployment. Altitude, distance, and the distribution
      of devices now become part of the analysis.
    notes:
    - label: "Spatial model"
      text: "UAVs are placed above a field of IoT devices. The diagram distinguishes UAV altitude from the link distance to an individual ground node, which both enter the network geometry."
    - label: "From one link to a field"
      text: "The subsequent analysis averages over spatial realizations rather than assigning every device the same separation. This connects the prototype’s wake-up mechanism to probabilities of intended and unintended activation across a sensor field."
    image: /images/paper-stories/aerial-data-aggregation/figure-17.webp
    page: 12
  - title: Construct a spatial network realization.
    text: A sample field places UAVs and IoT nodes in a geometric setting. The realization illustrates the spatial assumptions
      used when evaluating wake-up and unintended wake-up events.
    notes:
    - label: "Symbols and cells"
      text: "Triangles mark UAV locations and dots mark ground IoT devices. The Voronoi boundaries partition the sample field spatially, connecting an individual nearest-UAV relationship to the network model."
    - label: "A spatial realization"
      text: "The drawing is one realization of the assumed point processes at the stated UAV and IoT intensities. It supports the probability calculations that follow; it is not a map of a deployed agricultural site."
    image: /images/paper-stories/aerial-data-aggregation/figure-18.webp
    page: 13
  - title: Choose a detection threshold.
    text: Wake-up and false wake-up probabilities respond differently to the threshold power. Simulation points provide a
      check on the analytical curves used to evaluate that tradeoff.
    notes:
    - label: "Two probabilities"
      text: "The solid wake-up curve and dashed false-wake-up curve both vary with the receiver’s power threshold. Raising the threshold suppresses false activations, but also reduces the chance of detecting an intended wake-up."
    - label: "Model and simulation"
      text: "Simulation markers are overlaid on the analytical curves. Their comparison checks the network approximation, while the gap between the two probability curves exposes the threshold-selection tradeoff."
    image: /images/paper-stories/aerial-data-aggregation/figure-19.webp
    page: 14
  - title: Study the effect of altitude.
    text: Changing UAV height alters both desired and unintended wake-up probabilities. Comparing thresholds shows why a deployment
      setting must consider more than communication range alone.
    notes:
    - label: "Across thresholds"
      text: "The two threshold choices, −24 dBm and −18 dBm, give separate wake-up and false-wake-up curves. Comparing a threshold pair holds the receiver setting fixed while the UAV altitude changes."
    - label: "Reading the tradeoff"
      text: "Both probabilities tend to decrease with greater altitude in this model. Lower false-wake-up probability is therefore accompanied by weaker intended detection, rather than being a free improvement in selectivity."
    image: /images/paper-stories/aerial-data-aggregation/figure-20.webp
    page: 14
  - title: Study density and energy conversion together.
    text: The final network-scale comparison varies UAV intensity and power-conversion efficiency. It connects local receiver
      behavior to the probability that a device is activated across a distributed deployment.
    notes:
    - label: "Across UAV densities"
      text: "The horizontal axis varies the UAV point-process intensity. More nearby transmitters increase the opportunity for intended wake-up, but also increase the probability of unintended activation."
    - label: "Across conversion efficiencies"
      text: "Separate curve pairs use power-conversion coefficients of 1 and 0.7. Comparing them connects the network-level probabilities to receiver efficiency instead of treating the radio hardware as an ideal energy converter."
    image: /images/paper-stories/aerial-data-aggregation/figure-21.webp
    page: 14
  conclusion_title: Connect the prototype to deployment decisions.
  conclusion: The figures build from circuit and board design to measured reach, timing constraints, and network-scale probabilities.
    That progression connects an implemented device to the tradeoffs needed for a larger aerial sensing system.
  related:
