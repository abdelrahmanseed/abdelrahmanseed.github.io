<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <meta name="theme-color" content="#174c38">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/one-page.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/figure-pairs.css' | relative_url }}">
    <script>document.documentElement.classList.replace('no-js', 'js');</script>
    <script defer src="{{ '/assets/js/one-page.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/research-models.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/research-labs.js' | relative_url }}"></script>
  </head>
  <body class="one-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="#about" aria-label="Abdelrahman S. Abdelrahman, home">Abdelrahman S. Abdelrahman</a>
      <nav class="section-nav" aria-label="Main navigation"><a href="#research">Research</a><a href="#teaching">Teaching</a><a href="#work">Applied work</a><a href="#background">Background</a></nav>

    <main id="main">{{ content }}</main>

    {% include analytics.html %}
