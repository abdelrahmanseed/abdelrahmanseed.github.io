{% include base_path %}

<!-- start custom head snippets -->
{% if content contains 'data-box-embed' %}<script src="{{ '/assets/js/embed-focus.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>{% endif %}

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Favicon adapted from the UC Santa Barbara seal image. -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=ucsb"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=ucsb" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=ucsb" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="shortcut icon" href="{{ base_path }}/favicon.ico?v=ucsb"/>
<link rel="icon" href="{{ base_path }}/favicon.ico?v=ucsb"/>
<meta name="theme-color" content="#ffffff"/>

{% if page.story_key %}<link rel="stylesheet" href="{{ '/assets/css/figure-pairs.css' | relative_url }}">{% endif %}

<!-- end custom head snippets -->
